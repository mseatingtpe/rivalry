<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>《對手》</title>
<style>
/*__FONT_CSS__*/

/* ── tokens ─────────────────────────────────────────────
   Night ink. Single hue: one pale tone over deep ink desk;
   every secondary is the same pale at reduced alpha. */
:root {
  --desk-hi: #1c1c21;
  --desk:    #141417;
  --desk-lo: #0d0d10;
  --face-hi: #202026;
  --face:    #1a1a1f;
  --face-lo: #16161a;
  --back-hi: #18181d;
  --back-lo: #121216;
  --pale:    #e6e5e1;
  --pale-90: rgba(230, 229, 225, .90);
  --pale-55: rgba(230, 229, 225, .55);
  --pale-40: rgba(230, 229, 225, .40);
  --pale-25: rgba(230, 229, 225, .25);
  --pale-12: rgba(230, 229, 225, .12);
  --mono: "Rivalry Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --card-h: min(46svh, 108vw);          /* staged card */
  --back-h: clamp(88px, 14svh, 124px);  /* table card backs */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  font-family: var(--mono);
  color: var(--pale-90);
  background-color: var(--desk);
  background-image: radial-gradient(130% 90% at 50% -10%,
    var(--desk-hi) 0%, var(--desk) 55%, var(--desk-lo) 100%);
  background-attachment: fixed;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
}

/* paper grain — inline turbulence, never blocks touches */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 99;
  pointer-events: none;
  opacity: .05;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="220" height="220" filter="url(%23n)"/></svg>');
}

.hidden { display: none !important; }
body.instant *, body.instant *::before, body.instant *::after {
  transition-duration: 0s !important;
  transition-delay: 0s !important;
  animation-duration: 0s !important;
  animation-delay: 0s !important;
}

/* ── intro ── */
#intro {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 1.4rem;
  z-index: 5;
  transition: opacity .45s ease;
}
#intro.leave { opacity: 0; pointer-events: none; }
#intro > * { max-width: 100%; }

.intro-title {
  font-size: clamp(2rem, 9vw, 2.9rem);
  font-weight: 500;
  letter-spacing: .06em;
  color: var(--pale);
}
.intro-byline {
  margin-top: 1.4rem;
  font-size: .66rem;
  letter-spacing: .1em;
  color: var(--pale-40);
}
.intro-rule { width: 26px; height: 1px; background: var(--pale-40); margin: 3.2rem 0; }
.intro-epigraph {
  font-size: clamp(.98rem, 4.2vw, 1.12rem);
  line-height: 2.3;
  letter-spacing: .08em;
  margin: 0 0 3.6rem;
  color: var(--pale-90);
}
.intro-modes { display: flex; gap: 1.6rem; }
.mode-btn {
  font-family: inherit;
  font-size: .92rem;
  letter-spacing: .38em;
  text-indent: .38em;
  color: var(--pale-90);
  background: transparent;
  border: 1px solid var(--pale-55);
  padding: .78em 1.5em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .25s ease, color .25s ease;
}
.mode-btn:active { background: var(--pale); color: var(--desk); }

.rise { opacity: 0; animation: rise 1s cubic-bezier(.22,.61,.36,1) forwards; }
@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}
.d1 { animation-delay: .12s; }
.d2 { animation-delay: .42s; }
.d3 { animation-delay: .62s; }
.d4 { animation-delay: .82s; }
.d5 { animation-delay: 1.15s; }

/* ── card face（舞台）─────────────────────────────── */
.stage {
  position: fixed;
  left: 0; right: 0; top: 0;
  height: 62svh;
  pointer-events: none;
}
.card {
  position: absolute; /* both stage cards stack dead-center */
  inset: 0;
  margin: auto;
  height: var(--card-h);
  width: calc(var(--card-h) / 1.5);
  border: 1px solid var(--pale-55);
  background-image: linear-gradient(180deg, var(--face-hi) 0%, var(--face) 58%, var(--face-lo) 100%);
  display: flex;
  align-items: center;
  padding: calc(9px + 1.9rem) calc(9px + 1.4rem);
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  pointer-events: auto;
  cursor: pointer;
  opacity: 0;
}
.card::before { /* inner frame */
  content: "";
  position: absolute;
  inset: 9px;
  border: 1px solid var(--pale-25);
  pointer-events: none;
}
.card .act-label {
  position: absolute;
  top: calc(9px + 1.05rem);
  left: 0; right: 0;
  text-align: center;
  font-size: .62rem;
  letter-spacing: .62em;
  text-indent: .62em;
  color: var(--pale-40);
}
.card .q {
  width: 100%;
  font-size: clamp(.95rem, 2.3svh, 1.1rem);
  line-height: 2.25;
  letter-spacing: .09em;
  color: var(--pale-90);
}

/* enter / exit choreography — spring-flavored */
.card.enter {
  opacity: 1;
  transform: none;
  transition:
    transform .62s cubic-bezier(.3, 1.18, .4, 1),
    opacity .5s ease;
}
.card.exit {
  opacity: 0;
  transform: translateX(-9vw) rotate(-3.5deg) scale(.97);
  transition: transform .4s cubic-bezier(.5, 0, .75, .6), opacity .38s ease;
}
.card.slow { transition-duration: 1.05s, .9s; }

/* ── table（下方牌桌）─────────────────────────────── */
.table {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: 38svh;
  pointer-events: none;
}
.origin { /* fan / pile coordinate origin: bottom center */
  position: absolute;
  left: 50%;
  bottom: max(4.5svh, env(safe-area-inset-bottom));
  width: 0; height: 0;
}
.back {
  position: absolute;
  height: var(--back-h);
  width: calc(var(--back-h) / 1.5);
  left: calc(var(--back-h) / -3);  /* center on origin */
  bottom: 0;
  border: 1px solid var(--pale-40);
  background-image: linear-gradient(180deg, var(--back-hi), var(--back-lo));
  pointer-events: auto;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  transition:
    transform .6s cubic-bezier(.3, 1.14, .42, 1),
    opacity .45s ease;
}
.back::before {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px solid var(--pale-25);
  pointer-events: none;
}
.back.dim { opacity: .28; pointer-events: none; }
.back.flying {
  opacity: 0;
  transition:
    transform .5s cubic-bezier(.45, .05, .3, 1),
    opacity .42s ease .1s;
  z-index: 3;
}

.pile-label {
  position: absolute;
  bottom: calc(-1.55rem - env(safe-area-inset-bottom) * 0);
  transform: translateX(-50%);
  font-size: .58rem;
  letter-spacing: .4em;
  text-indent: .4em;
  color: var(--pale-40);
  white-space: nowrap;
  transition: opacity .45s ease;
}
.pile-label.dim { opacity: .3; }

/* ── discard pile（左緣，抽過的牌）── */
.discard {
  position: fixed;
  left: max(.7rem, env(safe-area-inset-left));
  top: 31svh;
  transform: translateY(-50%);
  height: clamp(58px, 9svh, 84px);
  width: calc(clamp(58px, 9svh, 84px) / 1.5);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  z-index: 6;
  opacity: 1;
  transition: opacity .5s ease;
}
.discard.empty { opacity: 0; pointer-events: none; }
.disc-back {
  position: absolute;
  inset: 0;
  border: 1px solid var(--pale-25);
  background-image: linear-gradient(180deg, var(--back-hi), var(--back-lo));
  transition: transform .45s cubic-bezier(.3, 1.14, .42, 1), opacity .4s ease;
}
.disc-back::before {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px solid var(--pale-12);
  pointer-events: none;
}
.disc-back.pop { transform: translateY(-9px); opacity: 0; }

/* ── review overlay（翻閱棄牌，唯讀）── */
.review {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(9, 9, 12, .93);
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s ease;
}
.review.open { opacity: 1; pointer-events: auto; }
.review .card { opacity: 1; cursor: pointer; transition: opacity .22s ease, transform .22s ease; }
.review .card.swap { opacity: 0; transform: translateY(6px); }

/* ── chrome ── */
.progress {
  position: fixed;
  right: max(1rem, env(safe-area-inset-right));
  bottom: max(.9rem, env(safe-area-inset-bottom));
  font-size: .62rem;
  letter-spacing: .12em;
  color: var(--pale-40);
  z-index: 4;
}
.next-btn {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 40.5svh; /* the seam between stage and table */
  font-family: inherit;
  font-size: .68rem;
  letter-spacing: .3em;
  text-indent: .3em;
  color: var(--pale-55);
  background: transparent;
  border: 1px solid var(--pale-25);
  padding: .6em 1.3em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  z-index: 4;
  transition: opacity .4s ease;
}
.next-btn:active { background: var(--pale); color: var(--desk); }
.replay {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: max(3.2svh, env(safe-area-inset-bottom));
  font-family: inherit;
  font-size: .72rem;
  letter-spacing: .3em;
  text-indent: .3em;
  color: var(--pale-55);
  background: none;
  border: none;
  border-bottom: 1px solid var(--pale-25);
  padding: .4em .2em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  opacity: 0;
  transition: opacity .9s ease;
  z-index: 4;
}
.replay.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .rise { animation-duration: .01s; animation-delay: 0s; }
  .card, .back, #intro { transition-duration: .01s !important; }
}
</style>
</head>
<body>

<main id="intro">
  <h1 class="intro-title rise d1">《對手》</h1>
  <p class="intro-byline rise d2">這是根據《無用之用 Master of None》的作者在意的事寫成的牌組。</p>
  <div class="intro-rule rise d3"></div>
  <p class="intro-epigraph rise d4">所有答案只代表今天的你。明天可以翻案。</p>
  <div class="intro-modes rise d5">
    <button class="mode-btn" data-mode="acts">照三幕</button>
    <button class="mode-btn" data-mode="shuffle">亂序</button>
  </div>
</main>

<div class="stage">
  <div class="card hidden" id="cardA"><div class="act-label"></div><div class="q"></div></div>
  <div class="card hidden" id="cardB"><div class="act-label"></div><div class="q"></div></div>
</div>

<div class="table"><div class="origin" id="origin"></div></div>

<div class="discard empty" id="discard"></div>
<div class="review" id="review">
  <div class="card" id="cardR"><div class="act-label"></div><div class="q"></div></div>
</div>

<button class="next-btn hidden" id="next">下一張</button>
<div class="progress hidden" id="progress"></div>
<button class="replay" id="replay">再洗一次</button>

<script>
'use strict';
//__DECK_JS__

(() => {
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);
  const origin = $('origin');
  const progressEl = $('progress');
  const nextBtn = $('next');

  // ── state ──
  let deck = [];        // 25 cards, final last
  let ptr = 0;          // next card to reveal
  let mode = null;
  let piles = [];       // acts mode: [{act, els: [back...], labelEl}]
  let fanEls = [];      // backs currently in the fan
  let finalEl = null;   // the final card's back
  let stagedIs = 'A';
  let busy = false;
  let lastAdvance = 0;

  const vw = () => window.innerWidth;
  const instant = () => RM || document.body.classList.contains('instant');

  // ── geometry ──
  const setT = (el, x, y, r, s = 1) => {
    el.style.transform = `translate(${x}px, ${-y}px) rotate(${r}deg) scale(${s})`;
  };

  function fanPositions(n) {
    const R = Math.min(Math.max(vw() * 1.05, 360), 640);
    const backH = Math.min(Math.max(88, window.innerHeight * .14), 124);
    // keep edges on screen; in shuffle, also clear the final card's corner
    const maxX = vw() / 2 - (backH / 1.5) * (mode === 'shuffle' ? 1.75 : .72);
    const maxA = Math.asin(Math.min(1, maxX / R));
    const per = n > 1 ? Math.min(6.5 * Math.PI / 180, (2 * maxA) / (n - 1)) : 0;
    const edgeDrop = (1 - Math.cos(per * (n - 1) / 2)) * R;
    return Array.from({ length: n }, (_, i) => {
      const a = (i - (n - 1) / 2) * per;
      // edges rest near the baseline; the arc's crown lifts gently
      const y = edgeDrop - (1 - Math.cos(a)) * R + 18;
      return { x: Math.sin(a) * R, y, r: (a * 180) / Math.PI };
    });
  }

  const jitter = (i) => ((i * 7919) % 5) - 2; // deterministic tiny rotation

  function makeBack() {
    const el = document.createElement('div');
    el.className = 'back';
    origin.appendChild(el);
    return el;
  }

  // ── table setup ──
  const PILE_GAP = () => Math.min(vw() * .24, 118);

  function pileX(k, nPiles) { return (k - (nPiles - 1) / 2) * PILE_GAP(); }
  function finalX(nPiles) { return pileX(nPiles - 1, nPiles) + PILE_GAP() * .12; }

  function buildTable() {
    origin.innerHTML = '';
    piles = []; fanEls = [];
    const counts = { [ACT_RECOGNITION]: 0, [ACT_RIVAL]: 0, [ACT_PRICE]: 0 };
    deck.slice(0, 24).forEach((c, i) => {
      const act = c.act === ACT_BLANK ? blankActOf(deck, i) : c.act;
      counts[act]++;
    });

    if (mode === 'acts') {
      const acts = [ACT_RECOGNITION, ACT_RIVAL, ACT_PRICE];
      acts.forEach((act, k) => {
        const els = Array.from({ length: counts[act] }, (_, j) => {
          const el = makeBack();
          setT(el, pileX(k, 4) + j * .5, j * .6, jitter(j + k * 3));
          el.classList.add('dim');
          el.dataset.pile = k;
          el.addEventListener('click', () => onPileTap(k));
          return el;
        });
        const label = document.createElement('div');
        label.className = 'pile-label dim';
        label.textContent = act;
        label.style.left = `${pileX(k, 4)}px`;
        origin.appendChild(label);
        piles.push({ act, els, labelEl: label, opened: false });
      });
      placeFinal(finalX(4));
    } else {
      // shuffle: one big pile, fans open immediately
      fanEls = deck.slice(0, 24).map((_, j) => {
        const el = makeBack();
        setT(el, j * .4, j * .45, jitter(j));
        el.addEventListener('click', () => onBackTap(el));
        return el;
      });
      placeFinal(vw() / 2 - Math.min(Math.max(88, window.innerHeight * .14), 124) / 1.5 * .78);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        openFan();
      }));
    }
  }

  function placeFinal(x) {
    finalEl = makeBack();
    finalEl.classList.add('dim');
    setT(finalEl, x, 4, 2.5);
    finalEl.addEventListener('click', onFinalTap);
  }

  // ── fan choreography ──
  function openFan() {
    const pos = fanPositions(fanEls.length);
    fanEls.forEach((el, i) => {
      el.style.transitionDelay = instant() ? '0s' : `${i * 26}ms`;
      el.style.zIndex = 2;
      setT(el, pos[i].x, pos[i].y, pos[i].r);
      el.classList.remove('dim');
    });
    setTimeout(() => fanEls.forEach((el) => (el.style.transitionDelay = '0s')),
      fanEls.length * 26 + 60);
  }

  function refan() {
    const pos = fanPositions(fanEls.length);
    fanEls.forEach((el, i) => setT(el, pos[i].x, pos[i].y, pos[i].r));
  }

  function onPileTap(k) {
    const pile = piles[k];
    if (busy || pile.opened || !pileIsCurrent(k)) return;
    pile.opened = true;
    pile.labelEl.classList.add('dim');
    setTimeout(() => pile.labelEl.style.opacity = 0, 200);
    fanEls = pile.els;
    fanEls.forEach((el) => {
      el.removeEventListener('click', el._pileTap);
      el.addEventListener('click', () => onBackTap(el));
    });
    openFan();
  }

  function pileIsCurrent(k) {
    return piles.slice(0, k).every((p) => p.opened && p.els.every((e) => !e.isConnected))
      && !piles[k].opened;
  }

  function updateLights() {
    if (mode !== 'acts') { lightFinalIfDone(); return; }
    const k = piles.findIndex((p) => !p.opened);
    if (k >= 0 && pileIsCurrent(k)) {
      piles[k].els.forEach((el) => el.classList.remove('dim'));
      piles[k].labelEl.classList.remove('dim');
    }
    lightFinalIfDone();
  }

  function lightFinalIfDone() {
    const questionsLeft = fanEls.some((e) => e.isConnected)
      || (mode === 'acts' && piles.some((p) => !p.opened));
    if (!questionsLeft && finalEl) finalEl.classList.remove('dim');
  }

  // ── drawing ──
  function onBackTap(el) {
    if (busy || !el.isConnected || el.classList.contains('dim')) return;
    drawFrom(el);
  }

  function advance() {
    const now = Date.now();
    if (busy || now - lastAdvance < 380) return;
    const live = fanEls.filter((e) => e.isConnected && !e.classList.contains('dim'));
    if (live.length) { drawFrom(live[Math.floor(live.length / 2)]); return; }
    if (mode === 'acts') {
      const k = piles.findIndex((p) => !p.opened);
      if (k >= 0 && pileIsCurrent(k)) { onPileTap(k); return; }
    }
    if (finalEl && !finalEl.classList.contains('dim')) onFinalTap();
  }

  function drawFrom(el, slow = false) {
    busy = true;
    lastAdvance = Date.now();
    const card = deck[ptr++];

    // the tapped back flies up toward the stage and dissolves
    const or = origin.getBoundingClientRect();
    const rise = or.top - window.innerHeight * .31; // positive px, upward
    el.classList.add('flying');
    el.style.transform = `translate(0px, ${-rise}px) rotate(0deg) scale(1.9)`;

    fanEls = fanEls.filter((e) => e !== el);
    setTimeout(() => { el.remove(); refan(); }, instant() ? 0 : 300);

    showCard(card, slow);

    setTimeout(() => {
      busy = false;
      updateLights();
      if (card.act === ACT_FINAL) endGame();
    }, instant() ? 30 : (slow ? 950 : 520));
  }

  function onFinalTap() {
    if (busy || !finalEl || finalEl.classList.contains('dim')) return;
    const el = finalEl;
    finalEl = null;
    nextBtn.classList.add('hidden');
    drawFrom(el, true);
  }

  // ── stage ──
  function showCard(card, slow) {
    const cur = $(`card${stagedIs}`);
    stagedIs = stagedIs === 'A' ? 'B' : 'A';
    const nxt = $(`card${stagedIs}`);

    if (cur.classList.contains('enter')) {
      cur.classList.remove('enter');
      cur.classList.add('exit');
      setTimeout(() => { cur.classList.add('hidden'); cur.classList.remove('exit'); }, instant() ? 0 : 420);
    } else {
      cur.classList.add('hidden');
    }

    nxt.querySelector('.act-label').textContent = card.act === ACT_FINAL ? '' : card.act;
    nxt.querySelector('.q').textContent = card.text;
    nxt.classList.remove('hidden', 'exit', 'enter', 'slow');
    if (slow) nxt.classList.add('slow');
    // start slightly below + smaller, as if rising from the table
    nxt.style.transform = 'translateY(7svh) scale(.9)';
    nxt.style.opacity = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      nxt.style.transform = ''; nxt.style.opacity = '';
      nxt.classList.add('enter');
    }));

    progressEl.textContent = `${ptr}／${deck.length}`;
    progressEl.classList.remove('hidden');
    if (ptr < 24) nextBtn.classList.remove('hidden');
    updateDiscard();
  }

  // ── discard pile + read-only review（進程仍只能往前）──
  const discardEl = $('discard');
  const reviewEl = $('review');
  const cardR = $('cardR');
  let rIdx = 0;

  const history = () => deck.slice(0, Math.max(0, ptr - 1));

  function updateDiscard() {
    const n = history().length;
    discardEl.classList.toggle('empty', n === 0);
    while (discardEl.children.length > Math.min(n, 6)) discardEl.firstChild.remove();
    while (discardEl.children.length < Math.min(n, 6)) {
      const b = document.createElement('div');
      const j = discardEl.children.length;
      b.className = 'disc-back pop';
      b.style.zIndex = j;
      discardEl.appendChild(b);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        b.classList.remove('pop');
        b.style.transform = `translate(${j * 1.2}px, ${-j * 1.1}px) rotate(${jitter(j)}deg)`;
      }));
    }
  }

  function renderReview() {
    const h = history();
    const c = h[h.length - 1 - rIdx]; // rIdx 0 = most recent
    cardR.querySelector('.act-label').textContent = c.act === ACT_FINAL ? '' : c.act;
    cardR.querySelector('.q').textContent = c.text;
  }

  function reviewNav(dir) { // +1 = older, -1 = newer
    const h = history();
    const next = Math.min(Math.max(rIdx + dir, 0), h.length - 1);
    if (next === rIdx) return;
    rIdx = next;
    cardR.classList.add('swap');
    setTimeout(() => { renderReview(); cardR.classList.remove('swap'); }, instant() ? 0 : 200);
  }

  discardEl.addEventListener('click', () => {
    if (!history().length) return;
    rIdx = 0; // most recent first
    renderReview();
    reviewEl.classList.add('open');
  });
  reviewEl.addEventListener('click', (e) => {
    if (e.target === reviewEl) reviewEl.classList.remove('open');
  });
  cardR.addEventListener('click', () => reviewNav(1));
  {
    let rx = null, ry = null;
    cardR.addEventListener('touchstart', (e) => {
      rx = e.touches[0].clientX; ry = e.touches[0].clientY;
    }, { passive: true });
    cardR.addEventListener('touchend', (e) => {
      if (rx === null) return;
      const dx = e.changedTouches[0].clientX - rx;
      const dy = e.changedTouches[0].clientY - ry;
      if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy)) reviewNav(dx < 0 ? 1 : -1);
      rx = ry = null;
    }, { passive: true });
  }

  function endGame() {
    nextBtn.classList.add('hidden');
    setTimeout(() => $('replay').classList.add('show'), RM ? 100 : 1400);
  }

  // ── inputs ──
  document.querySelectorAll('.mode-btn').forEach((b) =>
    b.addEventListener('click', () => {
      if (mode) return;
      mode = b.dataset.mode;
      deck = buildDeck(mode);
      $('intro').classList.add('leave');
      setTimeout(() => $('intro').classList.add('hidden'), 500);
      buildTable();
      if (mode === 'acts') setTimeout(updateLights, RM ? 0 : 450);
    })
  );

  ['cardA', 'cardB'].forEach((id) => {
    const el = $(id);
    el.addEventListener('click', advance);
    // swipe left to advance
    let x0 = null, y0 = null;
    el.addEventListener('touchstart', (e) => {
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    }, { passive: true });
    el.addEventListener('touchend', (e) => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0;
      const dy = e.changedTouches[0].clientY - y0;
      if (dx < -42 && Math.abs(dy) < Math.abs(dx)) advance();
      x0 = y0 = null;
    }, { passive: true });
  });

  nextBtn.addEventListener('click', advance);
  $('replay').addEventListener('click', () => location.reload());

  window.addEventListener('resize', () => { if (fanEls.length) refan(); });

  // ── TEMP screenshot hooks（#shot-table / #shot-fan / #shot-staged / #shot-shuffle / #shot-end）──
  const shot = location.hash.match(/^#shot-(\w+)$/);
  if (shot) {
    document.body.classList.add('instant');
    const go = (m) => {
      mode = m; deck = buildDeck(m);
      $('intro').classList.add('hidden');
      buildTable();
      updateLights();
    };
    const step = shot[1];
    if (step === 'table') go('acts');
    if (step === 'fan') { go('acts'); onPileTap(0); }
    if (step === 'staged') { go('acts'); onPileTap(0); drawFrom(fanEls[3]); }
    if (step === 'shuffle') go('shuffle');
    if (step === 'review') {
      go('acts'); onPileTap(0);
      for (let k = 0; k < 3; k++) { drawFrom(fanEls[0]); busy = false; }
      rIdx = 0; renderReview(); reviewEl.classList.add('open');
    }
    if (step === 'end') {
      // cheat straight to the final card: table cleared, only 終卡 staged
      go('acts');
      origin.innerHTML = '';
      piles = []; fanEls = []; finalEl = null;
      ptr = 25;
      showCard(deck[24], true);
      nextBtn.classList.add('hidden');
      endGame();
    }
    setTimeout(() => document.body.classList.remove('instant'), 400);
  }
})();
</script>
</body>
</html>
