<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>《對手》</title>
<style>
/*__FONT_CSS__*/

/* ── tokens ─────────────────────────────────────────────
   Single hue only: warm paper + one ink color; every
   secondary tone is the same ink at reduced alpha. */
:root {
  --paper:    #f1ecdf;
  --paper-hi: #f7f3e9;
  --paper-lo: #e7e0cd;
  --ink:      #221d12;
  --ink-70:   rgba(34, 29, 18, .70);
  --ink-45:   rgba(34, 29, 18, .45);
  --ink-28:   rgba(34, 29, 18, .28);
  --mono: "Rivalry Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* portrait 2:3 — height-driven, width = height ÷ 1.5 */
  --card-h: min(62svh, 128vw);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  font-family: var(--mono);
  color: var(--ink);
  background-color: var(--paper);
  /* light falls from above — same hue, luminosity only */
  background-image: radial-gradient(130% 100% at 50% -8%,
    var(--paper-hi) 0%, var(--paper) 55%, var(--paper-lo) 100%);
  background-attachment: fixed;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
}

/* paper grain — inline SVG turbulence, never blocks touches */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 99;
  pointer-events: none;
  opacity: .04;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="220" height="220" filter="url(%23n)"/></svg>');
}

/* ── screens ── */
.screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: max(1.4rem, env(safe-area-inset-top)) 1.4rem max(1.4rem, env(safe-area-inset-bottom));
}
.hidden { display: none; }
.screen > * { max-width: 100%; } /* long CJK lines must wrap, not push the column */

/* ── intro ── */
#intro { text-align: center; }

.intro-title {
  font-size: clamp(2rem, 9vw, 2.9rem);
  font-weight: 500;
  letter-spacing: .06em;
}

.intro-byline {
  margin-top: 1.4rem;
  font-size: .66rem;
  letter-spacing: .1em;
  color: var(--ink-45);
}

.intro-rule {
  width: 26px;
  height: 1px;
  background: var(--ink-45);
  margin: 3.2rem 0;
}

.intro-epigraph {
  font-size: clamp(.98rem, 4.2vw, 1.12rem);
  line-height: 2.3;
  letter-spacing: .08em;
  margin: 0 0 3.6rem;
}

.intro-modes { display: flex; gap: 1.6rem; }

.mode-btn {
  font-family: inherit;
  font-size: .92rem;
  letter-spacing: .38em;
  text-indent: .38em; /* recenter the letter-spaced label */
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--ink-70);
  padding: .78em 1.5em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .25s ease, color .25s ease;
}
.mode-btn:active { background: var(--ink); color: var(--paper-hi); }

/* staggered entrance: fade + gentle rise */
.rise { opacity: 0; animation: rise 1s cubic-bezier(.22,.61,.36,1) forwards; }
@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}
.d1 { animation-delay: .12s; }
.d2 { animation-delay: .42s; }
.d3 { animation-delay: .62s; }
.d4 { animation-delay: .82s; }
.d5 { animation-delay: 1.15s; }

/* ── card ─────────────────────────────────────────────
   The protagonist. Double frame: 1px near-black outer,
   a thin translucent inner frame inset ~9px. A whisper of
   vertical gradient for paper thickness — no drop shadow. */
.card {
  position: relative;
  height: var(--card-h);
  width: calc(var(--card-h) / 1.5);
  border: 1px solid var(--ink);
  background-image: linear-gradient(180deg,
    var(--paper-hi) 0%, var(--paper) 58%, #ebe4d2 100%);
  display: flex;
  align-items: center;
  padding: calc(9px + 2rem) calc(9px + 1.5rem);
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.card::before { /* inner frame */
  content: "";
  position: absolute;
  inset: 9px;
  border: 1px solid var(--ink-28);
  pointer-events: none;
}

.card .act-label {
  position: absolute;
  top: calc(9px + 1.15rem);
  left: 0;
  right: 0;
  text-align: center;
  font-size: .62rem;
  letter-spacing: .62em;
  text-indent: .62em;
  color: var(--ink-45);
}

.card .q {
  width: 100%;
  font-size: clamp(.98rem, 2.4svh, 1.15rem);
  line-height: 2.3;
  letter-spacing: .09em;
  text-align: left;
}

/* card back — same double-frame language, one tone deeper, unmarked */
.card.back {
  background-image: linear-gradient(180deg, #ece6d6 0%, #e6dfcc 58%, #e0d8c1 100%);
}

/* ── stage (Phase 2: static preview only) ── */
#stage { gap: 2.6rem; }

.next-btn {
  font-family: inherit;
  font-size: .78rem;
  letter-spacing: .3em;
  text-indent: .3em;
  color: var(--ink-70);
  background: transparent;
  border: 1px solid var(--ink-28);
  padding: .66em 1.4em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.next-btn:active { background: var(--ink); color: var(--paper-hi); }

.progress {
  position: fixed;
  right: max(1rem, env(safe-area-inset-right));
  bottom: max(.9rem, env(safe-area-inset-bottom));
  font-size: .62rem;
  letter-spacing: .12em;
  color: var(--ink-45);
}

/* ══ TEMP style gallery（checkpoint A）══
   Three variants for Sunny to pick from; the losers get deleted.
   A 鉛字印刷 = refined base below. B 老借書卡. C 終端機票券. */

.variant-switch {
  position: fixed;
  top: max(.8rem, env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  gap: 1.4rem;
}
.variant-switch button {
  font-family: inherit;
  font-size: .7rem;
  letter-spacing: .1em;
  color: var(--ink-45);
  background: none;
  border: none;
  padding: .4em .6em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.variant-switch button.on { color: var(--ink); text-decoration: underline; text-underline-offset: .45em; }

/* ── B 老借書卡：格線、戳章幕標、更深的墨 ── */
body[data-variant="b"] {
  --paper: #efe9d8;
  --paper-hi: #f5f0e2;
  --paper-lo: #e3dbc4;
  --ink: #251f12;
}
body[data-variant="b"] .card::after { /* ruled lines, header area kept clear */
  content: "";
  position: absolute;
  inset: calc(9px + 2.9rem) 9px 9px;
  background-image: repeating-linear-gradient(to bottom,
    rgba(37, 31, 18, .14) 0 1px, transparent 1px 2.5em);
  pointer-events: none;
}
body[data-variant="b"] .card .act-label { /* stamp */
  left: 50%;
  right: auto;
  top: calc(9px + .95rem);
  transform: translateX(-50%) rotate(-2deg);
  border: 1px solid var(--ink-45);
  padding: .38em .55em .3em 1.1em;
  letter-spacing: .55em;
  text-indent: 0;
  color: var(--ink-70);
}
body[data-variant="b"] .progress {
  border: 1px solid var(--ink-28);
  padding: .35em .6em .3em;
}
body[data-variant="b"] .intro-rule { height: 3px; border-top: 1px solid var(--ink-45); border-bottom: 1px solid var(--ink-45); background: none; }

/* ── C 終端機票券：暗桌面、虛線、括號幕標 ── */
body[data-variant="c"] {
  --paper: #eee8d7;
  --paper-hi: #f2ecdc;
  --paper-lo: #d9cfb2;
}
body[data-variant="c"] { background-image: radial-gradient(130% 100% at 50% -8%, #ece5d1 0%, #e2d9c0 55%, #d3c8a6 100%); }
body[data-variant="c"] .card {
  background-image: linear-gradient(180deg, #f8f4e8 0%, #f3eddc 58%, #ece4cd 100%);
}
body[data-variant="c"] .card::before { border-style: dashed; }
body[data-variant="c"] .card::after { /* ticket tear-off line above the foot */
  content: "";
  position: absolute;
  left: 9px; right: 9px; bottom: calc(9px + 2.2rem);
  border-top: 1px dashed var(--ink-28);
  pointer-events: none;
}
body[data-variant="c"] .card .act-label::before { content: "［"; }
body[data-variant="c"] .card .act-label::after { content: "］"; }
body[data-variant="c"] .card .act-label { letter-spacing: .4em; text-indent: 0; }
body[data-variant="c"] .q { letter-spacing: .13em; }
body[data-variant="c"] .mode-btn, body[data-variant="c"] .next-btn { border-style: dashed; }
body[data-variant="c"] .intro-title { letter-spacing: .14em; text-indent: .14em; }

/* ── reduced motion: keep fades, drop movement ── */
@media (prefers-reduced-motion: reduce) {
  .rise { animation-duration: .01s; animation-delay: 0s; }
}
</style>
</head>
<body>

<nav class="variant-switch"><!-- TEMP: gallery picker, deleted after checkpoint A -->
  <button data-v="a" class="on">A</button>
  <button data-v="b">B</button>
  <button data-v="c">C</button>
</nav>

<main id="intro" class="screen">
  <h1 class="intro-title rise d1">《對手》</h1>
  <p class="intro-byline rise d2">這是根據《無用之用 Master of None》的作者在意的事寫成的牌組。</p>
  <div class="intro-rule rise d3"></div>
  <p class="intro-epigraph rise d4">所有答案只代表今天的你。明天可以翻案。</p>
  <div class="intro-modes rise d5">
    <button class="mode-btn" data-mode="acts">照三幕</button>
    <button class="mode-btn" data-mode="shuffle">亂序</button>
  </div>
</main>

<main id="stage" class="screen hidden">
  <div class="card" id="the-card">
    <div class="act-label" id="act-label"></div>
    <div class="q" id="q-text"></div>
  </div>
  <button class="next-btn" id="next">下一張</button>
</main>

<div class="progress hidden" id="progress"></div>

<script>
'use strict';
//__DECK_JS__

/* ── Phase 2 TEMP preview wiring ──
   Cycles a few representative cards (long / short / blank / final / back)
   so typography can be judged. Replaced by the real state machine in
   Phase 3. */
(() => {
  const samples = [
    { act: ACT_RECOGNITION, text: RECOGNITION_CARDS[4] }, // long, two sentences
    { act: ACT_PRICE, text: PRICE_CARDS[1] },             // short, no ending punct
    { act: ACT_RIVAL, text: RIVAL_CARDS[3] },
    { act: ACT_BLANK, text: BLANK_CARD },
    { act: ACT_FINAL, text: FINAL_CARD },                 // final: no act label
    { back: true },                                       // card back
  ];
  let i = 0;

  const intro = document.getElementById('intro');
  const stage = document.getElementById('stage');
  const card = document.getElementById('the-card');
  const actLabel = document.getElementById('act-label');
  const qText = document.getElementById('q-text');
  const progress = document.getElementById('progress');

  function render() {
    const s = samples[i];
    card.classList.toggle('back', !!s.back);
    actLabel.textContent = s.back || s.act === ACT_FINAL ? '' : s.act;
    qText.textContent = s.back ? '' : s.text;
    progress.textContent = `${(i % 25) + 1}／25`;
  }

  document.querySelectorAll('.mode-btn').forEach((b) =>
    b.addEventListener('click', () => {
      intro.classList.add('hidden');
      stage.classList.remove('hidden');
      progress.classList.remove('hidden');
      render();
    })
  );

  document.getElementById('next').addEventListener('click', () => {
    i = (i + 1) % samples.length;
    render();
  });

  // TEMP variant gallery picker (checkpoint A).
  document.querySelectorAll('.variant-switch button').forEach((b) =>
    b.addEventListener('click', () => {
      document.body.dataset.variant = b.dataset.v;
      document.querySelectorAll('.variant-switch button').forEach((x) => x.classList.toggle('on', x === b));
    })
  );

  // TEMP screenshot hooks: #shot-N jumps to sample N (no entrance anim);
  // an optional -vb / -vc suffix selects a gallery variant.
  const mv = location.hash.match(/-v([abc])/);
  if (mv) document.body.dataset.variant = mv[1];
  const m = location.hash.match(/#shot-(\d+)/);
  if (m) {
    document.querySelectorAll('.rise').forEach((el) => { el.style.animation = 'none'; el.style.opacity = 1; });
    i = Math.min(Number(m[1]), samples.length - 1);
    intro.classList.add('hidden');
    stage.classList.remove('hidden');
    progress.classList.remove('hidden');
    render();
  }
})();
</script>
</body>
</html>
