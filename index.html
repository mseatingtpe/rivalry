/* ── tokens ─────────────────────────────────────────────
   Single hue only: warm paper + one ink color; every
   secondary tone is the same ink at reduced alpha. */
:root {
  --paper:    #f1ecdf;
  --paper-hi: #f7f3e9;
  --paper-lo: #e7e0cd;
  --ink:      #221d12;
  --ink-70:   rgba(34, 29, 18, .70);
  --ink-45:   rgba(34, 29, 18, .45);
  --ink-28:   rgba(34, 29, 18, .28);
  --mono: "Rivalry Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* portrait 2:3 — height-driven, width = height ÷ 1.5 */
  --card-h: min(62svh, 128vw);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  font-family: var(--mono);
  color: var(--ink);
  background-color: var(--paper);
  /* light falls from above — same hue, luminosity only */
  background-image: radial-gradient(130% 100% at 50% -8%,
    var(--paper-hi) 0%, var(--paper) 55%, var(--paper-lo) 100%);
  background-attachment: fixed;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
}

/* paper grain — inline SVG turbulence, never blocks touches */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 99;
  pointer-events: none;
  opacity: .04;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="220" height="220" filter="url(%23n)"/></svg>');
}

/* ── screens ── */
.screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: max(1.4rem, env(safe-area-inset-top)) 1.4rem max(1.4rem, env(safe-area-inset-bottom));
}
.hidden { display: none; }
.screen > * { max-width: 100%; } /* long CJK lines must wrap, not push the column */

/* ── intro ── */
#intro { text-align: center; }

.intro-title {
  font-size: clamp(2rem, 9vw, 2.9rem);
  font-weight: 500;
  letter-spacing: .06em;
}

.intro-byline {
  margin-top: 1.4rem;
  font-size: .66rem;
  letter-spacing: .1em;
  color: var(--ink-45);
}

.intro-rule {
  width: 26px;
  height: 1px;
  background: var(--ink-45);
  margin: 3.2rem 0;
}

.intro-epigraph {
  font-size: clamp(.98rem, 4.2vw, 1.12rem);
  line-height: 2.3;
  letter-spacing: .08em;
  margin: 0 0 3.6rem;
}

.intro-modes { display: flex; gap: 1.6rem; }

.mode-btn {
  font-family: inherit;
  font-size: .92rem;
  letter-spacing: .38em;
  text-indent: .38em; /* recenter the letter-spaced label */
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--ink-70);
  padding: .78em 1.5em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .25s ease, color .25s ease;
}
.mode-btn:active { background: var(--ink); color: var(--paper-hi); }

/* staggered entrance: fade + gentle rise */
.rise { opacity: 0; animation: rise 1s cubic-bezier(.22,.61,.36,1) forwards; }
@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}
.d1 { animation-delay: .12s; }
.d2 { animation-delay: .42s; }
.d3 { animation-delay: .62s; }
.d4 { animation-delay: .82s; }
.d5 { animation-delay: 1.15s; }

/* ── card ─────────────────────────────────────────────
   The protagonist. Double frame: 1px near-black outer,
   a thin translucent inner frame inset ~9px. A whisper of
   vertical gradient for paper thickness — no drop shadow. */
.card {
  position: relative;
  height: var(--card-h);
  width: calc(var(--card-h) / 1.5);
  border: 1px solid var(--ink);
  background-image: linear-gradient(180deg,
    var(--paper-hi) 0%, var(--paper) 58%, #ebe4d2 100%);
  display: flex;
  align-items: center;
  padding: calc(9px + 2rem) calc(9px + 1.5rem);
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.card::before { /* inner frame */
  content: "";
  position: absolute;
  inset: 9px;
  border: 1px solid var(--ink-28);
  pointer-events: none;
}

.card .act-label {
  position: absolute;
  top: calc(9px + 1.15rem);
  left: 0;
  right: 0;
  text-align: center;
  font-size: .62rem;
  letter-spacing: .62em;
  text-indent: .62em;
  color: var(--ink-45);
}

.card .q {
  width: 100%;
  font-size: clamp(1rem, 2.55svh, 1.22rem);
  line-height: 2.15;
  letter-spacing: .06em;
  text-align: left;
}

/* card back — same double-frame language, one tone deeper, unmarked */
.card.back {
  background-image: linear-gradient(180deg, #ece6d6 0%, #e6dfcc 58%, #e0d8c1 100%);
}

/* ── stage (Phase 2: static preview only) ── */
#stage { gap: 2.6rem; }

.next-btn {
  font-family: inherit;
  font-size: .78rem;
  letter-spacing: .3em;
  text-indent: .3em;
  color: var(--ink-70);
  background: transparent;
  border: 1px solid var(--ink-28);
  padding: .66em 1.4em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.next-btn:active { background: var(--ink); color: var(--paper-hi); }

.progress {
  position: fixed;
  right: max(1rem, env(safe-area-inset-right));
  bottom: max(.9rem, env(safe-area-inset-bottom));
  font-size: .62rem;
  letter-spacing: .12em;
  color: var(--ink-45);
}

/* ── reduced motion: keep fades, drop movement ── */
@media (prefers-reduced-motion: reduce) {
  .rise { animation-duration: .01s; animation-delay: 0s; }
}
</style>
</head>
<body>

<main id="intro" class="screen">
  <h1 class="intro-title rise d1">《對手》</h1>
  <p class="intro-byline rise d2">這是根據《無用之用 Master of None》的作者在意的事寫成的牌組。</p>
  <div class="intro-rule rise d3"></div>
  <p class="intro-epigraph rise d4">所有答案只代表今天的你。明天可以翻案。</p>
  <div class="intro-modes rise d5">
    <button class="mode-btn" data-mode="acts">照三幕</button>
    <button class="mode-btn" data-mode="shuffle">亂序</button>
  </div>
</main>

<main id="stage" class="screen hidden">
  <div class="card" id="the-card">
    <div class="act-label" id="act-label"></div>
    <div class="q" id="q-text"></div>
  </div>
  <button class="next-btn" id="next">下一張</button>
</main>

<div class="progress hidden" id="progress"></div>

<script>
'use strict';
// deck.js — card data + deck building logic for《對手》.
// Card texts are the implementation-side SSOT, mirroring SPEC.md verbatim.
// Do NOT edit any Chinese text or punctuation; some cards intentionally
// lack trailing punctuation — that is the original manuscript.

const ACT_RECOGNITION = '辨識';
const ACT_RIVAL = '對手';
const ACT_PRICE = '代價';
const ACT_BLANK = '留白';
const ACT_FINAL = '終卡';

// Fixed in-act order (SPEC §卡片內容). Never reorder.
const RECOGNITION_CARDS = [
  '此時此刻最喜歡的書',
  '如果可以穿越任何時空，最想看的演唱會是？',
  '最近最喜歡的瞬間',
  '不提職業與職稱，你會如何介紹你自己？',
  '說一件你最近改變心意的事。以前怎麼想，現在怎麼想。',
  '哪一件別人眼中的「無用」之事你很喜歡？',
  '你有一種不被大眾理解、極其私人的「偏愛」嗎？',
  '你上一次覺得被看見，是哪個瞬間？說畫面。',
  '哪一個童年瞬間，形塑了現在的你？',
  '說一次你決定信任一個人的瞬間。你看到了什麼？',
  '一個你很喜歡、但決定不擁有的東西。',
  '你最近一次說謊，是為了保護什麼？',
];

const RIVAL_CARDS = [
  '朋友如何形容你時，你會很開心',
  '問我一個你猜沒有人問過我的問題。',
  '你覺得我誤解你最深的地方是哪裡？',
  '數到三，同時回答：對方身上一個你羨慕的能力。',
  '用你專業裡的一個詞，形容我們現在的關係。',
];

const PRICE_CARDS = [
  '你上一次覺得自己「沒有才華」是什麼時候？',
  '你會奮不顧身的事',
  '你為愛付過最貴的一次代價是什麼',
  '你預設人會怎麼讓你失望？',
  '我身上有哪一部分，是因為認識你才長出來的？',
  '說一件你已經原諒、但沒說出口的事。',
];

const BLANK_CARD = '跳過這輪。話語以外的空白，不一定需要被填滿。';

const FINAL_CARD = '我們不可能真正理解另外一個人。所以，約下一次。';

// ── deck building ──

const makeCards = (act, texts) => texts.map((text) => ({ act, text }));

/** The 23 question cards in canonical three-act order (no blank, no final). */
function orderedQuestions() {
  return [
    ...makeCards(ACT_RECOGNITION, RECOGNITION_CARDS),
    ...makeCards(ACT_RIVAL, RIVAL_CARDS),
    ...makeCards(ACT_PRICE, PRICE_CARDS),
  ];
}

const blankCard = () => ({ act: ACT_BLANK, text: BLANK_CARD });
const finalCard = () => ({ act: ACT_FINAL, text: FINAL_CARD });

/** Uniform in-place Fisher–Yates shuffle. */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/**
 * Build a 25-card deck. The final card is always last and never shuffled.
 *
 * mode 'acts'   — three acts in fixed order; the blank card is inserted into
 *                 one of the 24 gaps of the 23-question sequence, uniformly
 *                 at random (SPEC §留白牌歸屬 實作詮釋).
 * mode 'shuffle'— all 24 cards (questions + blank) fully shuffled.
 */
function buildDeck(mode) {
  if (mode !== 'acts' && mode !== 'shuffle') {
    throw new Error(`unknown mode: ${mode}`);
  }
  const questions = orderedQuestions();
  let deck;
  if (mode === 'acts') {
    const gap = Math.floor(Math.random() * (questions.length + 1)); // 0..23
    deck = [...questions.slice(0, gap), blankCard(), ...questions.slice(gap)];
  } else {
    deck = shuffle([...questions, blankCard()]);
  }
  deck.push(finalCard());
  return deck;
}

/**
 * Act a blank card belongs to, per SPEC: the act of the first non-blank
 * question after it; if none follows, the last act (代價).
 * `deck` may include the final card; the final card never claims a blank.
 */
function blankActOf(deck, blankIndex) {
  for (let i = blankIndex + 1; i < deck.length; i++) {
    const { act } = deck[i];
    if (act !== ACT_BLANK && act !== ACT_FINAL) return act;
  }
  return ACT_PRICE;
}


/* ── Phase 2 TEMP preview wiring ──
   Cycles a few representative cards (long / short / blank / final / back)
   so typography can be judged. Replaced by the real state machine in
   Phase 3. */
(() => {
  const samples = [
    { act: ACT_RECOGNITION, text: RECOGNITION_CARDS[4] }, // long, two sentences
    { act: ACT_PRICE, text: PRICE_CARDS[1] },             // short, no ending punct
    { act: ACT_RIVAL, text: RIVAL_CARDS[3] },
    { act: ACT_BLANK, text: BLANK_CARD },
    { act: ACT_FINAL, text: FINAL_CARD },                 // final: no act label
    { back: true },                                       // card back
  ];
  let i = 0;

  const intro = document.getElementById('intro');
  const stage = document.getElementById('stage');
  const card = document.getElementById('the-card');
  const actLabel = document.getElementById('act-label');
  const qText = document.getElementById('q-text');
  const progress = document.getElementById('progress');

  function render() {
    const s = samples[i];
    card.classList.toggle('back', !!s.back);
    actLabel.textContent = s.back || s.act === ACT_FINAL ? '' : s.act;
    qText.textContent = s.back ? '' : s.text;
    progress.textContent = `${(i % 25) + 1}／25`;
  }

  document.querySelectorAll('.mode-btn').forEach((b) =>
    b.addEventListener('click', () => {
      intro.classList.add('hidden');
      stage.classList.remove('hidden');
      progress.classList.remove('hidden');
      render();
    })
  );

  document.getElementById('next').addEventListener('click', () => {
    i = (i + 1) % samples.length;
    render();
  });

  // TEMP screenshot hook: #shot-N jumps straight to sample N, no entrance anim.
  const m = location.hash.match(/^#shot-(\d+)$/);
  if (m) {
    document.querySelectorAll('.rise').forEach((el) => { el.style.animation = 'none'; el.style.opacity = 1; });
    i = Math.min(Number(m[1]), samples.length - 1);
    intro.classList.add('hidden');
    stage.classList.remove('hidden');
    progress.classList.remove('hidden');
    render();
  }
})();
</script>
</body>
</html>
