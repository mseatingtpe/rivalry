/* ── tokens ─────────────────────────────────────────────
   Ma:Sonic 參照：冷灰白紙、近黑打字機墨、Klein blue 唯一 accent。
   Every secondary tone is the same ink at reduced alpha. */
:root {
  --paper-hi: #f1f0ea;
  --paper:    #eae8e1;
  --paper-lo: #dcdad1;
  --face-hi: #f6f5f0;
  --face:    #efeee8;
  --face-lo: #e6e4db;
  --back-hi: #e3e1d8;
  --back-lo: #d7d4c9;
  --ink:     #1b1b1a;
  --ink-90: rgba(27, 27, 26, .90);
  --ink-55: rgba(27, 27, 26, .55);
  --ink-40: rgba(27, 27, 26, .40);
  --ink-25: rgba(27, 27, 26, .25);
  --ink-12: rgba(27, 27, 26, .12);
  --blue:   #2528e0; /* the one loud thing */
  --mono: "Rivalry Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --card-h: min(46svh, 108vw);          /* staged card */
  --back-h: clamp(88px, 14svh, 124px);  /* table card backs */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  font-family: var(--mono);
  color: var(--ink-90);
  background-color: var(--paper);
  background-image: radial-gradient(130% 90% at 50% -10%,
    var(--paper-hi) 0%, var(--paper) 55%, var(--paper-lo) 100%);
  background-attachment: fixed;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
}

/* endgame breath: the desk deepens when only the final card remains */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1.8s ease;
}
body.endgame::before { opacity: 1; }
body::before { background: radial-gradient(120% 90% at 50% 30%, transparent 30%, rgba(27, 27, 26, .14) 100%); }

/* paper material — three inline layers, never blocks touches:
   1) fibre flecks（再生紙雜點） 2) fine tooth（紙牙） 3) pulp mottle（漿斑） */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 99;
  pointer-events: none;
  background-image:
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420"><filter id="s"><feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="11" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.11  0 0 0 0 0.11  0 0 0 0 0.10  0 0 2 0 -1.55"/></filter><rect width="420" height="420" filter="url(%23s)"/></svg>'),
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="220" height="220" filter="url(%23n)" opacity="0.04"/></svg>'),
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900"><filter id="m"><feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="3" seed="4" stitchTiles="stitch"/></filter><rect width="900" height="900" filter="url(%23m)" opacity="0.045"/></svg>');
}

.hidden { display: none !important; }
body.instant *, body.instant *::before, body.instant *::after {
  transition-duration: 0s !important;
  transition-delay: 0s !important;
  animation-duration: 0s !important;
  animation-delay: 0s !important;
}

/* ── intro ─────────────────────────────────────────────
   Asymmetric: the type block sits upper-left, the weight of the
   page is the empty lower-right. Blue dots drift behind it. */
#intro {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 1.4rem max(1.4rem, 8vw);
  z-index: 5;
  transition: opacity .45s ease;
}
#intro.leave { opacity: 0; pointer-events: none; }

.intro-block {
  position: relative;
  z-index: 2;
  max-width: 22rem;
  margin-bottom: 14svh; /* pushes the block up; emptiness below */
}
.intro-block > * { max-width: 100%; }

.intro-title {
  font-size: clamp(2.6rem, 13vw, 3.9rem);
  font-weight: 500;
  letter-spacing: .04em;
  color: var(--ink);
  line-height: 1.15;
}
.intro-byline {
  margin-top: 1.6rem;
  font-size: .66rem;
  line-height: 2.1;
  letter-spacing: .08em;
  color: var(--ink-40);
  max-width: 17rem;
}
.intro-byline a {
  color: var(--ink-55);
  text-decoration: none;
  border-bottom: 1px solid var(--blue);
  padding-bottom: .15em;
}
.intro-rule { width: 26px; height: 2px; background: var(--blue); margin: 2.8rem 0; }
.intro-epigraph {
  font-size: clamp(.98rem, 4.4vw, 1.1rem);
  line-height: 2.2;
  letter-spacing: .05em;
  margin: 0 0 3rem;
  color: var(--ink-90);
  line-break: strict;
  text-spacing-trim: trim-start;
}
.intro-modes { display: flex; gap: 1.1rem; }

/* corner stamp — signature, not instruction */
.intro-mark {
  position: absolute;
  right: max(1.4rem, 8vw);
  bottom: max(2.4rem, env(safe-area-inset-bottom));
  font-size: .6rem;
  letter-spacing: .22em;
  color: var(--ink-40);
  z-index: 2;
}

/* ── drifting blue dots ── */
.dots { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.dot {
  position: absolute;
  border-radius: 50%;
  background: var(--blue);
  opacity: 0;
  animation: dotIn .9s ease forwards, drift linear infinite;
}
@keyframes dotIn { to { opacity: var(--o, .9); } }
@keyframes drift {

/* ── card face（舞台）─────────────────────────────── */

  position: fixed;
  left: 0; right: 0; top: 0;
  height: 62svh;

  position: absolute; /* both stage cards stack dead-center */

  inset: 9px;
  border: 1px solid var(--ink-25);

  position: absolute;

  position: fixed;
  left: 0; right: 0; bottom: 0;

  position: absolute;
  height: var(--back-h);

<script>
'use strict';
// deck.js — card data + deck building logic for《對手》.
// Card texts are the implementation-side SSOT, mirroring SPEC.md verbatim.
// Do NOT edit any Chinese text or punctuation; some cards intentionally
// lack trailing punctuation — that is the original manuscript.

const ACT_RECOGNITION = '辨識';
const ACT_RIVAL = '對手';
const ACT_PRICE = '代價';
const ACT_BLANK = '留白';
const ACT_FINAL = '終卡';

// Fixed in-act order (SPEC §卡片內容). Never reorder.
const RECOGNITION_CARDS = [
  '此時此刻最喜歡的書',
  '如果可以穿越任何時空，最想看的演唱會是？',
  '最近最喜歡的瞬間',
  '不提職業與職稱，你會如何介紹你自己？',
  '說一件你最近改變心意的事。以前怎麼想，現在怎麼想。',
  '哪一件別人眼中的「無用」之事你很喜歡？',
  '你有一種不被大眾理解、極其私人的「偏愛」嗎？',
  '你上一次覺得被看見，是哪個瞬間？說畫面。',
  '哪一個童年瞬間，形塑了現在的你？',
  '說一次你決定信任一個人的瞬間。你看到了什麼？',
  '一個你很喜歡、但決定不擁有的東西。',
  '你最近一次說謊，是為了保護什麼？',
];

const RIVAL_CARDS = [
  '朋友如何形容你時，你會很開心',
  '問我一個你猜沒有人問過我的問題。',
  '你覺得我誤解你最深的地方是哪裡？',
  '數到三，同時回答：對方身上一個你羨慕的能力。',
  '用你專業裡的一個詞，形容我們現在的關係。',
];

const PRICE_CARDS = [
  '你上一次覺得自己「沒有才華」是什麼時候？',
  '你會奮不顧身的事',
  '你為愛付過最貴的一次代價是什麼',
  '你預設人會怎麼讓你失望？',
  '我身上有哪一部分，是因為認識你才長出來的？',
  '說一件你已經原諒、但沒說出口的事。',
];

const BLANK_CARD = '乾杯！'; // 2026-08-16 Sunny amended (was 跳過這輪…)

const FINAL_CARD = '我們不可能真正理解另外一個人。所以，約下一次。';

// ── English companions（DRAFT — Sunny 校對中；index-aligned with the
// arrays above. The final card stays Chinese-only by decision.）──
// Terse on purpose. Cards whose Chinese carries no ending punctuation get
// no closing period in English either — they stay fragments, as written.
const RECOGNITION_EN = [
  'The book you love right now',
  'Any time, any place — whose concert do you go to?',
  'A moment you have loved lately',
  'Without your job or your title: introduce yourself.',
  'Something you changed your mind about. What you thought then. What you think now.',
  'What do you love that others call useless?',
  'Do you have a private fondness no one else quite gets?',
  'The last time you felt seen. Describe the room.',
  'Which childhood moment made you this?',
  'A moment you decided to trust someone. What did you see?',
  'Something you love and chose not to own.',
  'Your last lie — what were you protecting?',
];

const RIVAL_EN = [
  'What a friend could say about you that would make you glad',
  'Ask me something you think no one has asked me.',
  'Where do I misunderstand you most?',
  'Count to three. Both answer: one thing the other can do that you envy.',
  'One word from your profession for what we are right now.',
];

const PRICE_EN = [
  'When did you last feel you had no talent?',
  'What you would throw yourself into',
  'The most expensive thing love has cost you',
  'How do you expect people to disappoint you?',
  'What part of me grew because I met you?',
  'Something you have forgiven and never said aloud.',
];

const BLANK_EN = 'Cheers!';

// ── deck building ──

const makeCards = (act, texts, ens) =>
  texts.map((text, i) => ({ act, text, en: ens[i] }));

/** The 23 question cards in canonical three-act order (no blank, no final). */
function orderedQuestions() {
  return [
    ...makeCards(ACT_RECOGNITION, RECOGNITION_CARDS, RECOGNITION_EN),
    ...makeCards(ACT_RIVAL, RIVAL_CARDS, RIVAL_EN),
    ...makeCards(ACT_PRICE, PRICE_CARDS, PRICE_EN),
  ];
}

const blankCard = () => ({ act: ACT_BLANK, text: BLANK_CARD, en: BLANK_EN });
const finalCard = () => ({ act: ACT_FINAL, text: FINAL_CARD }); // Chinese-only

/** Uniform in-place Fisher–Yates shuffle. */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/**
 * Build a 25-card deck. The final card is always last and never shuffled.
 *
 * mode 'acts'   — three acts in fixed order; the blank card is inserted into
 *                 one of the 24 gaps of the 23-question sequence, uniformly
 *                 at random (SPEC §留白牌歸屬 實作詮釋).
 * mode 'shuffle'— all 24 cards (questions + blank) fully shuffled.
 */
function buildDeck(mode) {
  if (mode !== 'acts' && mode !== 'shuffle') {
    throw new Error(`unknown mode: ${mode}`);
  }
  const questions = orderedQuestions();
  let deck;
  if (mode === 'acts') {
    const gap = Math.floor(Math.random() * (questions.length + 1)); // 0..23
    deck = [...questions.slice(0, gap), blankCard(), ...questions.slice(gap)];
  } else {
    deck = shuffle([...questions, blankCard()]);
  }
  deck.push(finalCard());
  return deck;
}

/**
 * Act a blank card belongs to, per SPEC: the act of the first non-blank
 * question after it; if none follows, the last act (代價).
 * `deck` may include the final card; the final card never claims a blank.
 */
function blankActOf(deck, blankIndex) {
  for (let i = blankIndex + 1; i < deck.length; i++) {
    const { act } = deck[i];
    if (act !== ACT_BLANK && act !== ACT_FINAL) return act;
  }
  return ACT_PRICE;
}


(() => {
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);
  const origin = $('origin');
  const progressEl = $('progress');
  const nextBtn = $('next');

  // ── state ──
  let deck = [];        // 25 cards, final last
  let ptr = 0;          // next card to reveal
  let mode = null;
  let piles = [];       // acts mode: [{act, els: [back...], labelEl}]
  let fanEls = [];      // backs currently in the fan
  let finalEl = null;   // the final card's back
  let stagedIs = 'A';
  let busy = false;
  let lastAdvance = 0;

  const vw = () => window.innerWidth;
  const instant = () => RM || document.body.classList.contains('instant');
  const buzz = (pattern) => { try { navigator.vibrate && navigator.vibrate(pattern); } catch {} };

  // ── CJK line breaking: split into clauses at full-width punctuation and
  // make each clause atomic, so a line never breaks inside a word. ──
  const CLAUSE_END = '，。、？！；：';
  function setZh(el, text) {
    el.textContent = '';
    let buf = '';
    const flush = () => {
      if (!buf) return;
      const span = document.createElement('span');
      span.className = 'cl';
      span.textContent = buf;
      el.appendChild(span);
      el.appendChild(document.createElement('wbr'));
      buf = '';
    };
    for (const ch of text) {
      buf += ch;
      if (CLAUSE_END.includes(ch)) flush();
    }
    flush();
  }

  // ── sound: synthesized paper whispers, no external files ──
  let AC = null, noiseBuf = null;
  function initAudio() {
    if (AC) { AC.resume && AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch {}
  }
  function swish(dur, vol, freq, delay = 0) {
    if (!AC || AC.state !== 'running') return;
    const t = AC.currentTime + delay;
    const src = AC.createBufferSource();
    src.buffer = noiseBuf;
    src.playbackRate.value = .9 + Math.random() * .2;
    const f = AC.createBiquadFilter();
    f.type = 'bandpass';
    f.Q.value = .8;
    f.frequency.setValueAtTime(freq, t);
    f.frequency.exponentialRampToValueAtTime(freq * .5, t + dur);
    const g = AC.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + dur * .25);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start(t, Math.random() * .5, dur + .05);
  }

  // ── geometry ──
  const setT = (el, x, y, r, s = 1) => {
    el._pos = { x, y, r, s };
    el.style.transform = `translate(${x}px, ${-y}px) rotate(${r}deg) scale(${s})`;
  };

  function fanPositions(n) {
    const R = Math.min(Math.max(vw() * 1.05, 360), 640);
    const backH = Math.min(Math.max(88, window.innerHeight * .14), 124);
    // keep edges on screen; in shuffle, also clear the final card's corner
    const maxX = vw() / 2 - (backH / 1.5) * (mode === 'shuffle' ? 1.75 : .72);
    const maxA = Math.asin(Math.min(1, maxX / R));
    const per = n > 1 ? Math.min(6.5 * Math.PI / 180, (2 * maxA) / (n - 1)) : 0;
    const edgeDrop = (1 - Math.cos(per * (n - 1) / 2)) * R;
    return Array.from({ length: n }, (_, i) => {
      const a = (i - (n - 1) / 2) * per;
      // edges rest near the baseline; the arc's crown lifts gently
      const y = edgeDrop - (1 - Math.cos(a)) * R + 18;
      return { x: Math.sin(a) * R, y, r: (a * 180) / Math.PI };
    });
  }

  const jitter = (i) => ((i * 7919) % 5) - 2; // deterministic tiny rotation

  function makeBack() {
    const el = document.createElement('div');
    el.className = 'back';
    origin.appendChild(el);
    return el;
  }

  // ── table setup ──
  const PILE_GAP = () => Math.min(vw() * .24, 118);

  function pileX(k, nPiles) { return (k - (nPiles - 1) / 2) * PILE_GAP(); }
  function finalX(nPiles) { return pileX(nPiles - 1, nPiles) + PILE_GAP() * .12; }

  // stagger the table pieces settling into place（就位）
  function settle(el, delay) {
    const target = el.style.transform;
    el._settleCancel = false;
    el.style.transition = 'none';
    el.style.transform = `${target} translateY(60px)`;
    el.style.opacity = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.transition = '';
      el.style.opacity = '';
      if (el._settleCancel) return; // a fan/draw already re-aimed this card
      el.style.transitionDelay = instant() ? '0s' : `${delay}ms`;
      el.style.transform = target;
      setTimeout(() => (el.style.transitionDelay = '0s'), delay + 700);
    }));
  }

  function buildTable() {
    origin.innerHTML = '';
    piles = []; fanEls = [];
    const counts = { [ACT_RECOGNITION]: 0, [ACT_RIVAL]: 0, [ACT_PRICE]: 0 };
    deck.slice(0, 24).forEach((c, i) => {
      const act = c.act === ACT_BLANK ? blankActOf(deck, i) : c.act;
      counts[act]++;
    });

    if (mode === 'acts') {
      const acts = [ACT_RECOGNITION, ACT_RIVAL, ACT_PRICE];
      acts.forEach((act, k) => {
        const els = Array.from({ length: counts[act] }, (_, j) => {
          const el = makeBack();
          setT(el, pileX(k, 4) + j * .5, j * .6, jitter(j + k * 3));
          el.classList.add('dim');
          el.dataset.pile = k;
          el.addEventListener('click', () => onPileTap(k));
          settle(el, 120 + k * 130 + j * 12);
          return el;
        });
        const label = document.createElement('div');
        label.className = 'pile-label dim';
        label.textContent = act;
        label.style.left = `${pileX(k, 4)}px`;
        origin.appendChild(label);
        piles.push({ act, els, labelEl: label, opened: false });
      });
      placeFinal(finalX(4));
    } else {
      // shuffle: one big pile, fans open immediately
      fanEls = deck.slice(0, 24).map((_, j) => {
        const el = makeBack();
        setT(el, j * .4, j * .45, jitter(j));
        el.addEventListener('click', () => onBackTap(el));
        return el;
      });
      placeFinal(vw() / 2 - Math.min(Math.max(88, window.innerHeight * .14), 124) / 1.5 * .78);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        openFan();
      }));
    }
  }

  function placeFinal(x) {
    finalEl = makeBack();
    finalEl.classList.add('dim');
    setT(finalEl, x, 4, 2.5);
    finalEl.addEventListener('click', onFinalTap);
    settle(finalEl, mode === 'acts' ? 620 : 380);
  }

  // ── fan choreography ──
  function openFan() {
    const pos = fanPositions(fanEls.length);
    fanEls.forEach((el, i) => {
      el._settleCancel = true;
      el.style.transitionDelay = instant() ? '0s' : `${i * 26}ms`;
      el.style.zIndex = 2;
      setT(el, pos[i].x, pos[i].y, pos[i].r);
      el.classList.remove('dim');
    });
    setTimeout(() => fanEls.forEach((el) => (el.style.transitionDelay = '0s')),
      fanEls.length * 26 + 60);
    buzz(25);
    for (let i = 0; i < 3; i++) swish(.08, .045, 1900, i * .06);
  }

  function refan() {
    const pos = fanPositions(fanEls.length);
    fanEls.forEach((el, i) => setT(el, pos[i].x, pos[i].y, pos[i].r));
  }

  function onPileTap(k) {
    const pile = piles[k];
    if (busy || pile.opened || !pileIsCurrent(k)) return;
    pile.opened = true;
    pile.labelEl.classList.add('dim');
    setTimeout(() => pile.labelEl.style.opacity = 0, 200);
    fanEls = pile.els;
    fanEls.forEach((el) => {
      el.removeEventListener('click', el._pileTap);
      el.addEventListener('click', () => onBackTap(el));
    });
    openFan();
  }

  function pileIsCurrent(k) {
    return piles.slice(0, k).every((p) => p.opened && p.els.every((e) => !e.isConnected))
      && !piles[k].opened;
  }

  function updateLights() {
    if (mode !== 'acts') { lightFinalIfDone(); return; }
    const k = piles.findIndex((p) => !p.opened);
    if (k >= 0 && pileIsCurrent(k)) {
      piles[k].els.forEach((el) => el.classList.remove('dim'));
      piles[k].labelEl.classList.remove('dim');
    }
    lightFinalIfDone();
  }

  function lightFinalIfDone() {
    const questionsLeft = fanEls.some((e) => e.isConnected)
      || (mode === 'acts' && piles.some((p) => !p.opened));
    if (!questionsLeft && finalEl && finalEl.classList.contains('dim')) {
      // ceremony: the desk deepens, the final card brightens slowly
      document.body.classList.add('endgame');
      finalEl.style.transitionDuration = instant() ? '' : '1.2s, 1.6s';
      finalEl.classList.remove('dim');
      setTimeout(() => { if (finalEl) finalEl.style.transitionDuration = ''; }, 1700);
      buzz(30);
      swish(.4, .05, 700);
    }
  }

  // ── drawing ──
  function onBackTap(el) {
    if (busy || !el.isConnected || el.classList.contains('dim')) return;
    drawFrom(el);
  }

  function advance() {
    const now = Date.now();
    if (busy || now - lastAdvance < 380) return;
    const live = fanEls.filter((e) => e.isConnected && !e.classList.contains('dim'));
    if (live.length) { drawFrom(live[Math.floor(live.length / 2)]); return; }
    if (mode === 'acts') {
      const k = piles.findIndex((p) => !p.opened);
      if (k >= 0 && pileIsCurrent(k)) { onPileTap(k); return; }
    }
    if (finalEl && !finalEl.classList.contains('dim')) onFinalTap();
  }

  function drawFrom(el, slow = false) {
    busy = true;
    lastAdvance = Date.now();
    const card = deck[ptr++];
    buzz(slow ? [30, 60, 30] : 18);
    swish(slow ? .5 : .12, slow ? .07 : .09, slow ? 900 : 1500);

    // the tapped back flies up toward the stage and dissolves
    const or = origin.getBoundingClientRect();
    const rise = or.top - window.innerHeight * .31; // positive px, upward
    el.classList.add('flying');
    el.style.transform = `translate(0px, ${-rise}px) rotate(0deg) scale(1.9)`;

    fanEls = fanEls.filter((e) => e !== el);
    setTimeout(() => { el.remove(); refan(); }, instant() ? 0 : 300);

    showCard(card, slow);

    setTimeout(() => {
      busy = false;
      updateLights();
      if (card.act === ACT_FINAL) endGame();
    }, instant() ? 30 : (slow ? 950 : 520));
  }

  function onFinalTap() {
    if (busy || !finalEl || finalEl.classList.contains('dim')) return;
    const el = finalEl;
    finalEl = null;
    nextBtn.classList.add('hidden');
    drawFrom(el, true);
  }

  // ── stage ──
  function showCard(card, slow) {
    const cur = $(`card${stagedIs}`);
    stagedIs = stagedIs === 'A' ? 'B' : 'A';
    const nxt = $(`card${stagedIs}`);

    if (cur.classList.contains('enter')) {
      cur.classList.remove('enter');
      cur.classList.add('exit');
      setTimeout(() => { cur.classList.add('hidden'); cur.classList.remove('exit'); }, instant() ? 0 : 420);
    } else {
      cur.classList.add('hidden');
    }

    nxt.querySelector('.act-label').textContent = card.act === ACT_FINAL ? '' : card.act;
    setZh(nxt.querySelector('.q-zh'), card.text);
    nxt.querySelector('.q-en').textContent = card.en || '';
    nxt.classList.remove('hidden', 'exit', 'enter', 'slow');
    if (slow) nxt.classList.add('slow');
    // start slightly below + smaller, as if rising from the table
    nxt.style.transform = 'translateY(7svh) scale(.9)';
    nxt.style.opacity = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      nxt.style.transform = ''; nxt.style.opacity = '';
      nxt.classList.add('enter');
    }));

    progressEl.textContent = `${ptr}／${deck.length}`;
    progressEl.classList.remove('hidden');
    if (ptr < 24) nextBtn.classList.remove('hidden');
    updateDiscard();
  }

  // ── discard pile + read-only overview（一次展開，進程仍只能往前）──
  const discardEl = $('discard');
  const reviewEl = $('review');

  const history = () => deck.slice(0, Math.max(0, ptr - 1));

  function updateDiscard() {
    const n = history().length;
    discardEl.classList.toggle('empty', n === 0);
    while (discardEl.children.length > Math.min(n, 6)) discardEl.firstChild.remove();
    while (discardEl.children.length < Math.min(n, 6)) {
      const b = document.createElement('div');
      const j = discardEl.children.length;
      b.className = 'disc-back pop';
      b.style.zIndex = j;
      discardEl.appendChild(b);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        b.classList.remove('pop');
        b.style.transform = `translate(${j * 1.2}px, ${-j * 1.1}px) rotate(${jitter(j)}deg)`;
      }));
    }
  }

  function openReview() {
    const h = history();
    if (!h.length) return;
    reviewEl.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'review-grid';
    h.forEach((c, i) => { // chronological: the game's record
      const m = document.createElement('div');
      m.className = 'mini';
      m.style.animationDelay = instant() ? '0s' : `${i * 35}ms`;
      const a = document.createElement('div');
      a.className = 'act-label';
      a.textContent = c.act === ACT_FINAL ? '' : c.act;
      const q = document.createElement('div');
      q.className = 'q';
      const zh = document.createElement('div');
      zh.className = 'q-zh';
      setZh(zh, c.text);
      const en = document.createElement('div');
      en.className = 'q-en';
      en.textContent = c.en || '';
      q.append(zh, en);
      m.append(a, q);
      grid.appendChild(m);
    });
    reviewEl.appendChild(grid);
    reviewEl.classList.add('open');
  }

  discardEl.addEventListener('click', openReview);
  reviewEl.addEventListener('click', (e) => {
    if (!e.target.closest('.mini')) reviewEl.classList.remove('open');
  });

  function endGame() {
    nextBtn.classList.add('hidden');
    setTimeout(() => $('replay').classList.add('show'), RM ? 100 : 1400);
  }

  // ── drifting blue dots（x%, y%, px, opacity, drift seconds）──
  const DOTS = [
    [ 82,  9, 10, .95, 26], [ 91, 21,  5, .75, 34], [ 70, 16,  6, .6,  30],
    [ 88, 44,  8, .85, 38], [ 76, 62,  5, .55, 29], [ 94, 71, 11, .9,  33],
    [ 63, 82,  7, .7,  27], [ 84, 89,  5, .5,  36], [ 47, 93,  9, .8,  31],
    [ 12, 88,  6, .6,  35], [  5, 66,  9, .85, 28], [ 26, 74,  4, .45, 32],
    [  8, 12,  5, .55, 30], [ 33,  6,  7, .7,  37], [ 58, 30,  4, .4,  25],
  ];
  {
    const wrap = $('dots');
    DOTS.forEach(([x, y, s, o, dur], i) => {
      const d = document.createElement('div');
      d.className = 'dot';
      d.style.cssText =
        `left:${x}%;top:${y}%;width:${s}px;height:${s}px;--o:${o};` +
        `animation-delay:${1 + i * .07}s, ${i * .4}s;animation-duration:.9s, ${dur}s`;
      wrap.appendChild(d);
    });
  }

  // ── inputs ──
  document.querySelectorAll('.mode-btn').forEach((b) =>
    b.addEventListener('click', () => {
      if (mode) return;
      initAudio(); // must start inside a user gesture
      mode = b.dataset.mode;
      deck = buildDeck(mode);
      $('intro').classList.add('leave');
      setTimeout(() => $('intro').classList.add('hidden'), 500);
      buildTable();
      if (mode === 'acts') setTimeout(updateLights, RM ? 0 : 450);
    })
  );

  ['cardA', 'cardB'].forEach((id) => {
    const el = $(id);
    el.addEventListener('click', advance);
    // swipe left to advance
    let x0 = null, y0 = null;
    el.addEventListener('touchstart', (e) => {
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    }, { passive: true });
    el.addEventListener('touchend', (e) => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0;
      const dy = e.changedTouches[0].clientY - y0;
      if (dx < -42 && Math.abs(dy) < Math.abs(dx)) advance();
      x0 = y0 = null;
    }, { passive: true });
  });

  // ── finger graze across the fan: the card under the finger rises ──
  let grazeEl = null;
  function raise(el, on) {
    const p = el._pos;
    if (!p) return;
    el.classList.add('graze');
    el.style.zIndex = on ? 5 : 2;
    el.style.transform = `translate(${p.x}px, ${-(p.y + (on ? 16 : 0))}px) rotate(${p.r}deg)`;
    if (!on) setTimeout(() => el.classList.remove('graze'), 320);
  }
  function grazeMove(x, y) {
    const hit = document.elementFromPoint(x, y);
    const back = hit && hit.closest ? hit.closest('.back') : null;
    const t = back && fanEls.includes(back) && !back.classList.contains('dim')
      && !back.classList.contains('flying') ? back : null;
    if (t === grazeEl) return;
    if (grazeEl) raise(grazeEl, false);
    grazeEl = t;
    if (t) { raise(t, true); buzz(8); swish(.05, .028, 2300); }
  }
  const tableEl = document.querySelector('.table');
  tableEl.addEventListener('touchstart', (e) => grazeMove(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
  tableEl.addEventListener('touchmove', (e) => grazeMove(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
  tableEl.addEventListener('touchend', () => {
    if (!grazeEl) return;
    const el = grazeEl;
    grazeEl = null;
    raise(el, false);
    onBackTap(el); // release draws the risen card
  });
  tableEl.addEventListener('touchcancel', () => {
    if (grazeEl) { raise(grazeEl, false); grazeEl = null; }
  });
  if (matchMedia('(hover: hover)').matches) {
    tableEl.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'mouse') grazeMove(e.clientX, e.clientY);
    });
    tableEl.addEventListener('pointerleave', () => {
      if (grazeEl) { raise(grazeEl, false); grazeEl = null; }
    });
  }

  nextBtn.addEventListener('click', advance);
  $('replay').addEventListener('click', () => location.reload());

  // desktop-only micro-tilt on the staged card
  if (matchMedia('(hover: hover)').matches && !RM) {
    ['cardA', 'cardB'].forEach((id) => {
      const el = $(id);
      el.addEventListener('pointermove', (e) => {
        const r = el.getBoundingClientRect();
        const dx = (e.clientX - r.left) / r.width - .5;
        el.style.setProperty('--tilt', `${(dx * 2.4).toFixed(2)}deg`);
      });
      el.addEventListener('pointerleave', () => el.style.setProperty('--tilt', '0deg'));
    });
  }

  window.addEventListener('resize', () => { if (fanEls.length) refan(); });

  // ── TEMP screenshot hooks（#shot-table / #shot-fan / #shot-staged / #shot-shuffle / #shot-end）──
  const shot = location.hash.match(/^#shot-(\w+)$/);
  if (shot) {
    document.body.classList.add('instant');
    const go = (m) => {
      mode = m; deck = buildDeck(m);
      $('intro').classList.add('hidden');
      buildTable();
      updateLights();
    };
    const step = shot[1];
    if (step === 'table') go('acts');
    if (step === 'fan') { go('acts'); onPileTap(0); }
    if (step === 'staged') { go('acts'); onPileTap(0); drawFrom(fanEls[3]); }
    if (step === 'shuffle') go('shuffle');
    if (step === 'review') {
      go('acts'); onPileTap(0);
      for (let k = 0; k < 5; k++) { drawFrom(fanEls[0]); busy = false; }
      openReview();
    }
    if (step === 'end') {
      // cheat straight to the final card: table cleared, only 終卡 staged
      go('acts');
      origin.innerHTML = '';
      piles = []; fanEls = []; finalEl = null;
      ptr = 25;
      showCard(deck[24], true);
      nextBtn.classList.add('hidden');
      endGame();
    }
    setTimeout(() => document.body.classList.remove('instant'), 400);
  }
})();
</script>
</body>
</html>
